name: Deploy GitHub Pages

on:
  push:
    branches:
      - feature/salida-cyl-development
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input "jupyter==1.1.1" "pandas==3.0.2"
      - run: npm ci
      - run: npm run license:check
      - run: npm run contest:submission:check
      - run: npm run lint
      - run: npm test -- --testTimeout=60000
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify Caddy container headers and SPA fallback
        run: |
          docker build -t salida-cyl:ci .
          docker run -d --name salida-cyl-ci -p 18080:8080 salida-cyl:ci
          trap 'docker rm -f salida-cyl-ci' EXIT
          CADDY_SMOKE_BASE_URL=http://127.0.0.1:18080 npm run release:caddy:verify
      - run: npm run build
        env:
          VITE_PUBLIC_BASE_PATH: /concursos_cyl/
      - run: npm run pages:prepare
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-and-build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
