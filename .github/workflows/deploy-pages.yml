name: Deploy GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input "jupyter==1.1.1" "pandas==3.0.2"
      - run: npm ci
      - run: npm run license:check
      - run: npm run contest:submission:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:release -- --testTimeout=60000
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify Caddy container headers and SPA fallback
        run: |
          docker build -t salida-cyl:ci .
          docker run -d --name salida-cyl-ci -p 18080:8080 salida-cyl:ci
          trap 'docker rm -f salida-cyl-ci' EXIT
          CADDY_SMOKE_BASE_URL=http://127.0.0.1:18080 npm run release:caddy:verify
      - run: npm run build
        env:
          VITE_PUBLIC_BASE_PATH: /concursos_cyl/
      - name: Write deployment version metadata
        run: npx --no-install tsx scripts/release/writeVersionMetadata.ts dist "${{ github.sha }}"
      - run: npm run pages:prepare
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-and-build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify-live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:pages:verify -- "${{ needs.deploy.outputs.page_url }}" "${{ github.sha }}"
