schemaVersion: 1
id: castilla-leon-openai-nan-pilot
reference:
  repository: https://github.com/Huntsman1756/agent-orchestration-starter
  release: v0.2.0
  releaseCommit: b899e1f546b974ccea0f9580510753c04cd6ccac
  commit: 42cf5c2b1b55628332ce9fc1089957bd4fca3931
  adaptation: frontier-supervised-bounded-local
adoption:
  level: BOUNDED_LOCAL
  runtimeV4Installed: true
  activationTarget: ANALYSIS_ONLY
  installationHash: e1a992bc17b3b484ea7fb0b94a211ee869a5f1975d54b3eda881ed45951ccdc7
  activationHash: ba50d0e3a916a66b1e7b3bd30e6d9296e3c2549cfdee5cbcbbc90b5153b8cce6
  hostCompositionHash: null
  publicationThroughRuntimeV4: false
delegationProvenance:
  schemaVersion: 4
  enforcement: DISABLED
  configurationRole: readiness-inventory-only
  readiness:
    protectedHostSigner: true
    protectedEvidenceStore: true
    syntheticShakedownPassed: true
    restartRecoveryPassed: true
    ciVerificationConfigured: false
  externalEvidence:
    signerKeyId: 8324060de49d8db6bd01f232854f24babda0ab7a01dce691eed7f3d0b253b53d
    shakedownProvenanceHash: 219c0d83ba174fd56cc07810179a37ef15a0cea15278965c52cdd22f1e896303
  trustBoundary:
    privateKey: protected-host-only
    publicKey: protected-ci-or-control-plane-only
    evidence: protected-broker-artifact-only
frontierSupervisor:
  enabled: true
  entrypoint: scripts/Invoke-FrontierSupervisedNanWorker.ps1
  maxAttempts: 2
  automaticWorkerRelaunchAfterFrontierRetry: true
  retryFromAcceptedBase: true
  freshWorkerSessionPerAttempt: true
  persistDecisionBeforeRelaunch: true
  failClosedOnInvalidDecision: true
  publicationAuthority: none
bindings:
  orchestrator:
    harness: codex
    provider: openai
    model: gpt-5.6-sol
    reasoningEffort: medium
    permissions: plan-and-review
  codeExecutor:
    harness: opencode
    provider: nan
    model: qwen3.6
    selectableModelProfiles:
      mechanical: qwen3.6
      reasoning: deepseek-v4-flash
      long-context: mimo-v2.5
    agent: nan-code
    permissions: bounded-repository-write
    maxSteps: 10
    retryMax: 1
    defaultBudgetProfile: small
    budgetProfiles:
      small: 50000
      batch: 150000
      research: 300000
      extended: 400000
    maxObservedTokensOverrideRange:
      min: 1000
      max: 1000000
    maxExecutionSeconds: 300
    duplicateWindowSeconds: 3600
    fallbackModels: []
  bulletinReader:
    harness: opencode
    provider: nan
    model: gemma4
    selectableModelProfiles:
      mechanical: gemma4
      reasoning: deepseek-v4-flash
      long-context: mimo-v2.5
    agent: nan-bulletin
    permissions: repository-read-only
    maxSteps: 12
  reviewer:
    harness: codex
    provider: openai
    model: gpt-5.6-sol
    reasoningEffort: medium
    permissions: read-only-review
routing:
  code:
    plan: orchestrator
    implement: codeExecutor
    verifyWith: reviewer
  bulletin:
    default: bulletinReader
    verifyWith: reviewer
  architecture: orchestrator
  security_review: orchestrator
  debugging:
    diagnose: orchestrator
    implement: codeExecutor
    verifyWith: reviewer
  cross_file_refactor:
    plan: orchestrator
    implement: codeExecutor
    verifyWith: reviewer
  multi_file:
    plan: orchestrator
    implement: codeExecutor
    verifyWith: reviewer
  manual_review: reviewer
controls:
  forbiddenNanModels:
    - glm5.2
  requireAllowedPathsForCode: true
  requireIndependentReview: true
  requireFrontierPlanForCode: true
  requireAcceptanceCriteriaForCode: true
  requireValidationForCode: true
  allowWorkerPublication: false
  credentialsInRepository: false
  enforceTelemetryRecording: true
  autoEscalationToSol: false
telemetry:
  directory: .agent-runs
  format: json
  topLevelFields:
    - telemetryId
    - simulated
    - taskType
    - selectedModel
    - attempts
    - changedPaths
    - contractViolation
    - validationFailed
    - tokensUsage
    - success
    - status
    - frontierContract
    - draftOutput
  attemptFields:
    - model
    - agent
    - attempt
    - retry
    - exitCode
    - tokens
    - changedPaths
    - validationExitCode
