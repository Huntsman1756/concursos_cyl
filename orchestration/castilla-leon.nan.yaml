schemaVersion: 1
id: castilla-leon-openai-nan-pilot
reference:
  repository: https://github.com/Huntsman1756/agent-orchestration-starter
  commit: 0d95676ac2c5f2365021514458180ca40e6a37a2
  adaptation: api-first-retry-telemetry
bindings:
  orchestrator:
    harness: codex
    provider: openai
    model: gpt-5.6-sol
    reasoningEffort: medium
    permissions: plan-and-review
  codeExecutor:
    harness: opencode
    provider: nan
    model: qwen3.6
    selectableModelProfiles:
      mechanical: qwen3.6
      reasoning: deepseek-v4-flash
      long-context: mimo-v2.5
    agent: nan-code
    permissions: bounded-repository-write
    maxSteps: 10
    retryMax: 1
    defaultBudgetProfile: small
    budgetProfiles:
      small: 50000
      batch: 150000
      research: 300000
      extended: 400000
    maxObservedTokensOverrideRange:
      min: 1000
      max: 1000000
    maxExecutionSeconds: 300
    duplicateWindowSeconds: 3600
    fallbackModels: []
  bulletinReader:
    harness: opencode
    provider: nan
    model: gemma4
    selectableModelProfiles:
      mechanical: gemma4
      reasoning: deepseek-v4-flash
      long-context: mimo-v2.5
    agent: nan-bulletin
    permissions: repository-read-only
    maxSteps: 12
  reviewer:
    harness: codex
    provider: openai
    model: gpt-5.6-sol
    reasoningEffort: medium
    permissions: read-only-review
routing:
  code:
    plan: orchestrator
    implement: codeExecutor
    verifyWith: reviewer
  bulletin:
    default: bulletinReader
    verifyWith: reviewer
  architecture: orchestrator
  security_review: orchestrator
  debugging:
    diagnose: orchestrator
    implement: codeExecutor
    verifyWith: reviewer
  cross_file_refactor:
    plan: orchestrator
    implement: codeExecutor
    verifyWith: reviewer
  multi_file:
    plan: orchestrator
    implement: codeExecutor
    verifyWith: reviewer
  manual_review: reviewer
controls:
  forbiddenNanModels:
    - glm5.2
  requireAllowedPathsForCode: true
  requireIndependentReview: true
  requireFrontierPlanForCode: true
  requireAcceptanceCriteriaForCode: true
  requireValidationForCode: true
  allowWorkerPublication: false
  credentialsInRepository: false
  enforceTelemetryRecording: true
  autoEscalationToSol: false
telemetry:
  directory: .agent-runs
  format: json
  topLevelFields:
    - telemetryId
    - simulated
    - taskType
    - selectedModel
    - attempts
    - changedPaths
    - contractViolation
    - validationFailed
    - tokensUsage
    - success
    - status
    - frontierContract
  attemptFields:
    - model
    - agent
    - attempt
    - retry
    - exitCode
    - tokens
    - changedPaths
    - validationExitCode
