schemaVersion: 1
id: castilla-leon-openai-nan-pilot
reference:
  repository: https://github.com/Huntsman1756/agent-orchestration-starter
  release: v0.2.0
  releaseCommit: b899e1f546b974ccea0f9580510753c04cd6ccac
  commit: 42cf5c2b1b55628332ce9fc1089957bd4fca3931
  adaptation: frontier-supervised-bounded-local
adoption:
  level: BOUNDED_LOCAL
  runtimeV4Installed: false
  publicationThroughRuntimeV4: false
delegationProvenance:
  schemaVersion: 4
  enforcement: DISABLED
  configurationRole: readiness-inventory-only
  readiness:
    protectedHostSigner: false
    protectedEvidenceStore: false
    syntheticShakedownPassed: false
    providerAttributionShakedownPassed: true
    maxConcurrentProviderResponsesVerified: 5
    providerAttributionBatchShakedownPassed: true
    concurrentBatchWorkersVerified: 2
    restartRecoveryPassed: false
    ciVerificationConfigured: false
  trustBoundary:
    privateKey: protected-host-only
    publicKey: protected-ci-or-control-plane-only
    evidence: protected-broker-artifact-only
frontierSupervisor:
  enabled: true
  entrypoint: scripts/Invoke-FrontierSupervisedNanWorker.ps1
  maxAttempts: 2
  automaticWorkerRelaunchAfterFrontierRetry: true
  retryFromAcceptedBase: true
  freshWorkerSessionPerAttempt: true
  persistDecisionBeforeRelaunch: true
  failClosedOnInvalidDecision: true
  publicationAuthority: none
batchExecutor:
  enabled: true
  entrypoint: scripts/Invoke-NanWorkerBatch.ps1
  adapter: scripts/Invoke-NanWorkerContract.ps1
  preferredForIndependentStoriesAtLeast: 2
  maxStoriesPerBatch: 20
  maxConcurrency: 5
  exactDisjointPathsRequired: true
  detachedWorktreePerStory: true
  stateOutsideRepository: true
  reviewMode: one-frontier-wave
  applyPatchesAutomatically: false
  bindContractToExactHead: true
nanProviderLimits:
  requestsPerMinutePerKey: 60
  concurrentRequestsPerKey: 5
  tokensPerMinutePerModel: 1500000
  retryPolicy:
    maxAttempts: 3
    retryableStatuses:
      - 429 # rate_limit_exceeded
      - 5xx # server errors
    retryAfterHeader: true
    retryAfterCapSeconds: 30
    nonRetryableStatuses:
      - 400 # invalid request
      - 401 # authentication failure
      - 402 # payment required
      - 403 # authorization failure
      - 404 # invalid endpoint/model path
    nonRetryable429Codes:
      - insufficient_quota
      - quota_exceeded
    rationale: |
      Only transient provider congestion (429 rate_limit_exceeded and 5xx
      server errors) justifies automatic retry. Authentication, quota, and
      the documented 400/401/402/403/404 errors are permanent for the session and must
      escalate to Frontier immediately.  Retry-After is respected but capped
      at 30 s to prevent unbounded stall.
  scheduling:
    isolatedSessionPerStory: true
    parallelizeIndependentStories: true
    serializeOverlappingPaths: true
    retryAfterProviderBackoff: true
agentTable:
  - model: qwen3.6
    agent: nan-code
    taskTypes:
      - code
    notes: "Primary mechanical code executor.  Fastest for bounded edits."
  - model: deepseek-v4-flash
    agent: nan-reasoning-code
    taskTypes:
      - code
    notes: "Reasoning contracts that exceed Qwen capability."
  - model: mimo-v2.5
    agent: nan-long-context-code
    taskTypes:
      - code
    notes: "Long-context and multi-file code contracts. Bulletin fallback retains nan-bulletin permissions."
  - model: gemma4
    agent: nan-bulletin
    taskTypes:
      - bulletin
    notes: "Bulletin-only reader.  Strictly prohibited for code tasks."
bindings:
  orchestrator:
    harness: codex
    provider: openai
    model: gpt-5.6-sol
    reasoningEffort: medium
    permissions: plan-and-review
  codeExecutor:
    harness: opencode
    provider: nan
    model: qwen3.6
    selectableModelProfiles:
      mechanical: qwen3.6
      reasoning: deepseek-v4-flash
      long-context: mimo-v2.5
    agent: nan-code
    permissions: bounded-repository-write
    maxSteps: 10
    retryMax: 1
    defaultBudgetProfile: small
    budgetProfiles:
      small: 100000
      batch: 500000
      research: 450000
      extended: 750000
    maxObservedTokensOverrideRange:
      min: 1000
      max: 1000000
    maxExecutionSeconds: 900
    admission:
      profile: provider-limit
      capacity: 5
      timeoutSeconds: 7200
      queueTimeConsumesExecutionTimeout: false
      scope: nan-provider-host-session
    isolation:
      xdgStatePerWorker: true
      credentialCopy: nan-only-temporary
      cleanupAfterAttempt: true
    duplicateWindowSeconds: 3600
    fallbackModels: []
  bulletinReader:
    harness: opencode
    provider: nan
    model: gemma4
    selectableModelProfiles:
      mechanical: gemma4
      reasoning: deepseek-v4-flash
      long-context: mimo-v2.5
    agent: nan-bulletin
    permissions: repository-read-only
    maxSteps: 12
  reviewer:
    harness: codex
    provider: openai
    model: gpt-5.6-sol
    reasoningEffort: medium
    permissions: read-only-review
routing:
  code:
    plan: orchestrator
    implement: codeExecutor
    verifyWith: reviewer
  bulletin:
    default: bulletinReader
    verifyWith: reviewer
  architecture: orchestrator
  security_review: orchestrator
  debugging:
    diagnose: orchestrator
    implement: codeExecutor
    verifyWith: reviewer
  cross_file_refactor:
    plan: orchestrator
    implement: codeExecutor
    verifyWith: reviewer
  multi_file:
    plan: orchestrator
    implement: codeExecutor
    verifyWith: reviewer
  manual_review: reviewer
controls:
  forbiddenNanModels:
    - glm5.2
  requireAllowedPathsForCode: true
  requireIndependentReview: true
  requireFrontierPlanForCode: true
  requireAcceptanceCriteriaForCode: true
  requireValidationForCode: true
  allowWorkerPublication: false
  credentialsInRepository: false
  enforceTelemetryRecording: true
  requireProviderResponseEvidence: true
  rejectClientOnlyUsageAsProviderEvidence: true
  restrictBulletinReadsToStagedInputs: true
  autoEscalationToSol: false
  requireBatchForIndependentStoriesAtLeast: 2
  requireExactPathsInBatch: true
  requireProviderReportedTokensForUsageClaims: true
  treatSimulatedTokensAsZero: true
telemetry:
  directory: .agent-runs
  format: json
  topLevelFields:
    - telemetryId
    - simulated
    - taskType
    - selectedModel
    - attempts
    - changedPaths
    - contractViolation
    - validationFailed
    - tokensUsage
    - success
    - status
    - frontierContract
    - providerEvidence
    - draftOutput
    - admission
  attemptFields:
    - model
    - agent
    - attempt
    - retry
    - exitCode
    - tokens
    - changedPaths
    - validationExitCode
