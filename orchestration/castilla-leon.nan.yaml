schemaVersion: 1
id: castilla-leon-openai-nan-pilot
reference:
  repository: https://github.com/Huntsman1756/agent-orchestration-starter
  adaptation: api-first-retry-telemetry
bindings:
  orchestrator:
    harness: codex
    provider: openai
    model: gpt-5.6-sol
    reasoningEffort: medium
    permissions: plan-and-review
  codeExecutor:
    harness: opencode
    provider: nan
    model: qwen3.6
    agent: nan-code
    permissions: bounded-repository-write
    maxSteps: 32
    retryMax: 3
    fallbackModels:
      - nan/mimo-v2.5
      - nan/deepseek-v4-flash
  bulletinReader:
    harness: opencode
    provider: nan
    model: gemma4
    agent: nan-bulletin
    permissions: repository-read-only
    maxSteps: 12
  reviewer:
    harness: codex
    provider: openai
    model: gpt-5.6-sol
    reasoningEffort: medium
    permissions: read-only-review
routing:
  code:
    default: codeExecutor
  bulletin:
    default: bulletinReader
    verifyWith: reviewer
  architecture: codeExecutor
  security_review: orchestrator
  debugging: codeExecutor
  cross_file_refactor: codeExecutor
  multi_file: codeExecutor
  manual_review: reviewer
controls:
  requireAllowedPathsForCode: true
  requireIndependentReview: true
  allowWorkerPublication: false
  credentialsInRepository: false
  enforceTelemetryRecording: true
  autoEscalationToSol: false
telemetry:
  directory: .agent-runs
  format: json
  topLevelFields:
    - telemetryId
    - simulated
    - taskType
    - selectedModel
    - attempts
    - changedPaths
    - contractViolation
    - validationFailed
    - tokensUsage
    - success
    - status
  attemptFields:
    - model
    - agent
    - attempt
    - retry
    - exitCode
    - tokens
    - changedPaths
    - validationExitCode
